  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 13px; line-height: 1.2; color: var(--color-text);\n  background: transparent; border: 1px solid transparent;\n  padding: calc(var(--space-2) * 0.85) var(--space-3);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 34px; height: 34px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-titl \n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showDateTime }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;gap:var(--space-2);padding-top:10px\">\n            <div class=\"field\" style=\"flex:1\">\n              <label>Date label<\u002Flabel>\n              <input class=\"input\" value=\"{{ dateLabel }}\" sc-camel-on-change=\"{{ onDate }}\">\n            <\u002Fdiv>\n            <div class=\"field\" style=\"flex:1\">\n              <label>Time<\u002Flabel>\n              <input class=\"input\" value=\"{{ timeLabel }}\" sc-camel-on-change=\"{{ onTime }}\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isPhone }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:12px 0 0\">\n            <span style=\"font-size:14px\">Frame width<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:10px\">\n              <input type=\"range\" min=\"320\" max=\"460\" step=\"2\" value=\"{{ width }}\" sc-camel-on-change=\"{{ onWidth }}\" style=\"width:150px;accent-color:var(--color-accent)\">\n              <span style=\"font-size:12px;width:44px;text-align:right\">{{ width }}px<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"height:1px;background:var(--color-divider);margin:0\"><\u002Fdiv>\n\n      <sc-if value=\"{{ showOverlaySection }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"{{ panelCls.overlay }}\" style=\"padding:var(--space-4)\">\n          <div class=\"pl-sec-head\" sc-camel-on-click=\"{{ panelToggle.overlay }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:var(--space-3)\"><h6 style=\"margin:0\">{{ overlaySectionTitle }}<\u00 o }}\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:var(--space-2);margin-top:var(--space-3)\">\n              <div class=\"field\" style=\"flex:1\">\n                <label>Followers<\u002Flabel>\n                <input class=\"input\" type=\"number\" min=\"0\" value=\"{{ twFollowers }}\" sc-camel-on-change=\"{{ onTwFollowers }}\">\n              <\u002Fdiv>\n              <div class=\"field\" style=\"flex:1\">\n                <label>Following<\u002Flabel>\n                <input class=\"input\" type=\"number\" min=\"0\" value=\"{{ twFollowing }}\" sc-camel-on-change=\"{{ onTwFollowing }}\">\n              <\u002Fdiv>\n              <div class=\"field\" style=\"flex:1\">\n                <label>Joined<\u002Flabel>\n                <input class=\"input\" value=\"{{ twJoinedVal }}\" sc-camel-on-change=\"{{ onTwJoined }}\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ igScreen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"{{ panelCls.instagram }}\" style=\"padding:var(--space-4)\">\n          <div class=\"pl-sec-head\" sc-camel-on-click=\"{{ panelToggle.instagram }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:var(--space-3)\"><h6 style=\"margin:0\">Instagram<\u002Fh6><svg class=\"pl-chev\" style=\"{{ panelChev.instagram }}\" width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div class=\"{{ panelAnimCls.instagram }}\"><div>\n          <div class=\"field\">\n            <label>Whose profile<\u002Flabel>\n            <div style=\"display:flex;gap:var(--space-2);flex-wrap:wrap\">\n              <sc-for list=\"{{ igProfileOpts }}\" as=\"ip\" hint            <span style=\"font-size:11px;color:color-mix(in srgb, var(--color-text) 50%, transparent)\">{{ igPostCountLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ igNoPosts }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0 0 var(--space-2);font-size:13px;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">No posts yet. Add one below, then upload a photo.<\u002Fp>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;gap:var(--space-2)\">\n            <sc-for list=\"{{ igPostRows }}\" as=\"ps\" hint-placeholder-count=\"3\">\n              <div style=\"border:1px solid var(--color-divider);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--color-surface)\">\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"{{ ps.thumbStyle }}\"><\u002Fspan>\n                  <label class=\"btn btn-secondary\" style=\"cursor:pointer;font-size:11px;padding:6px 10px;border-radius:999px\">Photo<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ ps.onImage }}\" style=\"display:none\"><\u002Flabel>\n                  <sc-if value=\"{{ ps.hasImage }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-secondary\" style=\"font-size:11px;padding:6px 10px;border-radius:999px\" sc-camel-on-click=\"{{ ps.onClearImage }}\">Clear<\u002Fbutton><\u002Fsc-if>\n                  <span style=\"margin-left:auto;display:flex;gap:4px\">\n                    <button class=\"btn btn-secondary\" style=\"padding:5px 9px;font-size:12px;border-radius:10px\" sc-camel-on-click=\"{{ ps.onUp }}\" title=\"Move up\">↑<\u002Fbutton>\n                    <button class=\"btn btn-secondary\" style=\"padding:5px 9px;font-size:12px;border-radius:10px\" sc-camel-on-click=\"{{ ps.onDown }}\" title=\"Move down\">↓<\u002Fbutton>\n                    <button class=\"btn btn-secondary\" style=\"padding:5px 9px;font-siz in=\"0\" value=\"{{ m.statView }}\" sc-camel-on-change=\"{{ m.onStatVw }}\" style=\"min-height:30px;font-size:12px\" title=\"Views\">\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ m.replyNote }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:11px;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">{{ m.replyNote }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ m.image }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <span style=\"{{ m.thumbStyle }}\"><\u002Fspan>\n                    <button class=\"btn btn-ghost\" style=\"font-size:12px\" sc-camel-on-click=\"{{ m.onClearImage }}\">Remove image<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)\">\n            <span style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">Add message from<\u002Fspan>\n            <sc-for list=\"{{ addOpts }}\" as=\"a\" hint-placeholder-count=\"2\">\n              <button class=\"btn btn-secondary\" style=\"font-size:12px\" sc-camel-on-click=\"{{ a.onAdd }}\">+ {{ a.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"padding:var(--space-4);border-top:1px solid var(--color-divider);font-size:12px;color:color-mix(in srgb, var(--color-text) 55%, transparent);line-height:1.6\">\n        Everything is saved in this browser automatically. Images made here are fictional mock-ups, not real messages from any real service.\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isWide }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;left:18px;bottom:18px;z-index:50;display:flex;align-items:center;gap:8px\">\n      <a class=\"pl-fbpill\" href=\"{{ feedbackUrl }}\" target=\"_blank\" rel=\"noopener\">💬 Leave feedback<\u002Fa>\n      <a class=\"pl-fbpill\" href=\"{{ madeByUrl }}\" target=\"_blank\" rel=\"noopener\">made by @jhkvrs<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ cropOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:90\" sc-camel-on-click=\"{{ doCropCancel }}\">\n      <div class=\"dialog\" style=\"width:min(380px,100%);max-height:92vh;overflow:auto;border-radius:24px\" sc-camel-on-click=\"{{ stop }}\">\n        <div class=\"dialog-title\">Edit photo<\u002Fdiv>\n        <div class=\"dialog-body\" style=\"display:flex;flex-direction:column;gap:var(--space-3)\">\n          <div style=\"{{ cropFrameStyle }}\" sc-camel-on-pointer-down=\"{{ onCropDown }}\">\n            <img src=\"{{ cropSrc }}\" style=\"{{ cropImgStyle }}\" draggable=\"false\">\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">Zoom<input type=\"range\" min=\"1\" max=\"4\" step=\"0.01\" value=\"{{ cropZoomVal }}\" sc-camel-on-change=\"{{ onCropZoom }}\" style=\"flex:1;accent-color:var(--color-accent)\"><\u002Fdiv>\n          <div style=\"display:flex;gap:4px;flex-wrap:wrap;border:1px solid var(--color-divider);border-radius:999px;padding:3px;width:fit-content\">\n            <sc-for list=\"{{ cropAspectOpts }}\" as=\"ca\" hint-placeholder-count=\"4\"><button style=\"{{ ca.style }}\" sc-camel-on-click=\"{{ ca.onPick }}\">{{ ca.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">Drag the photo to reposition it inside the frame.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dialog-actions\" style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <button class=\"btn btn-secondary\" style=\"border-radius:999px;padding:10px 18px\" sc-camel-on-click=\"{{ doCropOriginal }}\">Use original<\u002Fbutton>\n          <button class=\"btn btn-secondary\" style=\"border-radius:999px;padding:10px 18px\" sc-camel-on-click=\"{{ doCropCancel }}\">Cancel<\u002Fbutton>\n          <button class=\"btn btn-primary\" style=\"border-radius:999px;padding:10px 22px;margin-left:auto\" sc-camel-on-click=\"{{ doCropApply }}\">Apply<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:80;justify-content:flex-end\" sc-camel-on-click=\"{{ closeMenu }}\">\n      <div style=\"width:clamp(280px,52vw,460px);height:100%;background:var(--color-surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:12px;padding:24px 22px\" sc-camel-on-click=\"{{ stop }}\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\">\n          <span style=\"font-family:var(--font-heading);font-weight:800;font-size:22px\">Settings<\u002Fspan>\n          <button class=\"btn btn-secondary\" style=\"border-radius:50%;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center\" sc-camel-on-click=\"{{ closeMenu }}\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <button class=\"btn btn-secondary btn-block\" style=\"justify-content:flex-start;border-radius:14px;padding:15px 18px;font-size:15px\" sc-camel-on-click=\"{{ toggleTheme }}\">{{ themeLabel }}<\u002Fbutton>\n        <button class=\"btn btn-secondary btn-block\" style=\"justify-content:flex-start;border-radius:14px;padding:15px 18px;font-size:15px\" sc-camel-on-click=\"{{ menuAccount }}\">{{ accountLabel }}<\u002Fbutton>\n        <button class=\"btn btn-secondary btn-block\" style=\"justify-content:flex-start;border-radius:14px;padding:15px 18px;font-size:15px\" sc-camel-on-click=\"{{ menuHelp }}\">How it works<\u002Fbutton>\n        <button class=\"btn btn-secondary btn-block\" style=\"justify-content:flex-start;border-radius:14px;padding:15px 18px;font-size:15px\" sc-camel-on-click=\"{{ menuReset }}\">Reset<\u002Fbutton>\n        <a class=\"btn btn-secondary btn-block\" style=\"justify-content:flex-start;border-radius:14px;padding:15px 18px;font-size:15px;text-decoration:none\" href=\"{{ feedbackUrl }}\" target=\"_blank\" rel=\"noopener\">💬 Leave feedback<\u002Fa>\n        <span style=\"flex:1\"><\u002Fspan>\n        <a href=\"{{ madeByUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"text-align:center;font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);text-decoration:none;padding-top:8px\">made by @jhkvrs<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ accountOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:70\" sc-camel-on-click=\"{{ closeAccount }}\">\n      <div class=\"dialog\" style=\"width:min(560px,100%);max-height:85vh;overflow:auto;border-radius:24px\" sc-camel-on-click=\"{{ stop }}\">\n        <div class=\"dialog-title\">Account<\u002Fdiv>\n\n        <sc-if value=\"{{ accountsComingSoon }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"dialog-body\" style=\"text-align:center;padding:26px 8px 8px\">\n            <p style=\"margin:0;font-size:19px;font-weight:800;font-family:var(--font-heading)\">🚧 Coming Soon! 🚧<\u002Fp>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">Sign-in and synced profiles aren't ready yet. Everything you make is still saved right here in this browser.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ accountsEnabled }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-if value=\"{{ accountsOff }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"dialog-body\">\n            <p style=\"margin:0 0 10px\">Accounts are switched off on this copy of the site. Everything still works — your people and conversations are saved in this browser, they just do not follow you to another device.<\u002Fp>\n            <p style=\"margin:0\">To turn accounts on, follow SETUP.md: make a free Supabase project, then paste its URL and anon key into the ACCOUNTS CONFIG block near the top of <b>index.html<\u002Fb>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showAuthForm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"dialog-body\" style=\"display:flex;flex-direction:column;gap:var(--space-3)\">\n            <p style=\"margin:0\">Sign in to keep your people profiles — name, @handle, colour, badge and counts — on any device you use. Signing in is optional; the maker works without it.<\u002Fp>\n            <div class=\"field\">\n              <label>Email<\u002Flabel>\n              <input class=\"input\" type=\"email\" autocomplete=\"email\" value=\"{{ authEmail }}\" sc-camel-on-change=\"{{ onAuthEmail }}\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Password<\u002Flabel>\n              <input class=\"input\" type=\"password\" autocomplete=\"current-password\" value=\"{{ authPassword }}\" sc-camel-on-change=\"{{ onAuthPassword }}\">\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:var(--space-2);flex-wrap:wrap\">\n              <button class=\"btn btn-primary\" style=\"border-radius:999px;padding:10px 20px\" sc-camel-on-click=\"{{ doSignIn }}\" disabled=\"{{ authBusy }}\">Sign in<\u002Fbutton>\n              <button class=\"btn btn-secondary\" style=\"border-radius:999px;padding:10px 20px\" sc-camel-on-click=\"{{ doSignUp }}\" disabled=\"{{ authBusy }}\">Create account<\u002Fbutton>\n              <button class=\"btn btn-secondary\" style=\"border-radius:999px;padding:10px 20px;margin-left:auto\" sc-camel-on-click=\"{{ doGoogle }}\" disabled=\"{{ authBusy }}\">Continue with Google<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">New accounts get a confirmation email. Click the link in it before signing in.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"dialog-body\" style=\"display:flex;flex-direction:column;gap:var(--space-3)\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n              <span style=\"font-size:14px\">Signed in as <b>{{ userEmail }}<\u002Fb><\u002Fspan>\n              <button class=\"btn btn-secondary\" style=\"border-radius:999px;padding:7px 14px;margin-left:auto\" sc-camel-on-click=\"{{ doSignOut }}\">Sign out<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"height:1px;background:var(--color-divider)\"><\u002Fdiv>\n\n            <div>\n              <h6 style=\"margin:0 0 8px\">Saved profiles <span style=\"text-transform:none;letter-spacing:0;font-weight:400;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">{{ profileCount }}<\u002Fspan><\u002Fh6>\n              <sc-if value=\"{{ noProfiles }}\" hint-placeholder-val=\"{{ true }}\">\n                <p style=\"margin:0;font-size:13px;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">Nothing saved yet. Press the ☁ button beside a person in the People list to save them here.<\u002Fp>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <sc-for list=\"{{ savedRows }}\" as=\"sp\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;align-items:center;gap:10px;border:1px solid var(--color-divider);border-radius:14px;padding:8px 10px\">\n                    <span style=\"{{ sp.avStyle }}\">{{ sp.initials }}<\u002Fspan>\n                    <span style=\"display:flex;flex-direction:column;min-width:0;flex:1\">\n                      <span style=\"font-size:14px;font-weight:700\">{{ sp.name }}<\u002Fspan>\n                      <span style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">@{{ sp.handle }}<\u002Fspan>\n                    <\u002Fspan>\n                    <button class=\"btn btn-secondary\" style=\"border-radius:999px;padding:6px 13px;font-size:12px\" sc-camel-on-click=\"{{ sp.onUse }}\">Add to scene<\u002Fbutton>\n                    <button class=\"btn btn-secondary\" style=\"border-radius:999px;padding:6px 11px;font-size:12px\" sc-camel-on-click=\"{{ sp.onDelete }}\">×<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"height:1px;background:var(--color-divider)\"><\u002Fdiv>\n\n            <div>\n              <button class=\"btn btn-secondary\" style=\"border-radius:999px;padding:8px 16px;font-size:12px\" sc-camel-on-click=\"{{ doDeleteAccount }}\">Delete my account and everything in it<\u002Fbutton>\n              <div style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin-top:6px\">This removes your saved profiles and your sign-in. It cannot be undone.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ authMsg }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;padding:10px 12px;border-radius:14px;background:var(--color-accent-100);color:var(--color-accent-700)\">{{ authMsg }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <div class=\"dialog-actions\"><button class=\"btn btn-primary\" style=\"border-radius:999px;padding:10px 20px\" sc-camel-on-click=\"{{ closeAccount }}\">Close<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  \n\n  <sc-if value=\"{{ helpOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:60\" sc-camel-on-click=\"{{ closeHelp }}\">\n      <div class=\"dialog\" style=\"width:min(720px,100%);max-height:82vh;overflow:auto\" sc-camel-on-click=\"{{ stop }}\">\n        <div class=\"dialog-title\">How Parallel works<\u002Fdiv>\n        <div class=\"dialog-body\" style=\"display:flex;flex-direction:column;gap:var(--space-4)\">\n\n          <div>\n            <h6 style=\"margin:0 0 6px\">1 · Pick a style<\u002Fh6>\n            <p style=\"margin:0 0 6px\">Choose an app from the icon row at the top of the panel.<\u002Fp>\n            <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px\">\n              <li>Apps: Messages, Instagram, Discord, X, Facebook and Lock Screen.<\u002Fli>\n              <li>Instagram opens a second row of modes: DM, Story, Profile, Post and Inbox.<\u002Fli>\n              <li>Switching apps keeps your people and messages, so you can export the same cast many ways.<\u002Fli>\n              <li>On a phone, the preview sits above the controls.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div>\n            <h6 style=\"margin:0 0 6px\">2 · Set up the people<\u002Fh6>\n            <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px\">\n              <li>Rename anyone in the People list. You can have up to four people.<\u002Fli>\n              <li>Tap an avatar circle to change its colour, or press IMG to upload a photo.<\u002Fli>\n              <li>Photos are resized to 640px and stay in this browser only.<\u002Fli>\n              <li>The person marked YOU is the one whose messages appear on the right.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div>\n            <h6 style=\"margin:0 0 6px\">3 · Write the conversation<\u002Fh6>\n            <p style=\"margin:0 0 6px\">Add a message with the buttons under the Messages list, then type into it. Each message has these controls:<\u002Fp>\n            <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px\">\n              <li>The name button cycles the sender through your people.<\u002Fli>\n              <li>The emoji button adds a reaction.<\u002Fli>\n              <li>↩ turns the message into a reply to an earlier one. Press it again to move the quote, and once more to clear it.<\u002Fli>\n              <li>⏱ adds a time divider above the message.<\u002Fli>\n              <li>IMG attaches a photo.<\u002Fli>\n              <li>The arrows move the message up or down.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div>\n            <h6 style=\"margin:0 0 6px\">4 · Export<\u002Fh6>\n            <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px\">\n              <li>Download PNG saves exactly what you see, at 1×, 2× or 3× resolution.<\u002Fli>\n              <li>The frame height follows the number of messages, so a short chat exports as a short image.<\u002Fli>\n              <li>On iPhone and iPad, the image opens in a new tab. Press and hold it, then choose Save to Photos.<\u002Fli>\n              <li>Your work saves in this browser automatically, so closing the tab will not lose it.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div>\n            <h6 style=\"margin:0 0 6px\">5 · X (Twitter)<\u002Fh6>\n            <p style=\"margin:0 0 6px\">X has three layouts, chosen in the X panel.<\u002Fp>\n            <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px\">\n              <li>Tweet: the first message is the main post, and every message below it shows as a reply. Set the reply, repost, like and view counts on each.<\u002Fli>\n              <li>Profile: shows that person's posts under the header. The Viewer control switches between This is me, Follow and Following.<\u002Fli>\n              <li>Handles, the verified badge and the private lock live under each person in the People list.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div>\n            <h6 style=\"margin:0 0 6px\">6 · Instagram Profile &amp; Post<\u002Fh6>\n            <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px\">\n              <li>Profile shows a full profile with a 3-across grid. Post shows a single feed post.<\u002Fli>\n              <li>Both read the person picked in the Instagram panel.<\u002Fli>\n              <li>Add photos, captions, likes, comments, location and a liked-by name under Posts.<\u002Fli>\n              <li>Posts save in this browser only and do not sync to your account.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div>\n            <h6 style=\"margin:0 0 6px\">7 · Instagram Story &amp; Inbox<\u002Fh6>\n            <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px\">\n              <li>A Story holds any number of text blocks. Drag a block to move it, drag the bottom-right handle to resize, and the top-right handle to rotate.<\u002Fli>\n              <li>Each block can be boxed, bold, plain or highlighted, in any swatch colour.<\u002Fli>\n              <li>Inbox is the DM list with round Notes bubbles on top. Edit the notes in the panel.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div>\n            <h6 style=\"margin:0 0 6px\">8 · Lock Screen<\u002Fh6>\n            <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px\">\n              <li>An iOS-style lock screen: upload a wallpaper and set the big clock and date.<\u002Fli>\n              <li>Toggle the lock icon, flashlight and camera, a now-playing music card and a charging indicator.<\u002Fli>\n              <li>Add notifications from Messages, Instagram, Discord, X, Phone (a missed call) or a custom app.<\u002Fli>\n              <li>Reorder each notification and edit its title, message and time.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div style=\"height:1px;background:var(--color-divider);margin:0\"><\u002Fdiv>\n\n          <p style=\"margin:0;font-size:13px;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">Anything you make here is a fictional mock-up. It is not a real message, post or profile from any real service, and none of these companies are involved with this site.<\u002Fp>\n\n          <div style=\"height:1px;background:var(--color-divider);margin:0\"><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n            <a class=\"btn btn-primary\" style=\"border-radius:999px;padding:10px 20px;text-decoration:none\" href=\"{{ feedbackUrl }}\" target=\"_blank\" rel=\"noopener\">💬 Leave feedback<\u002Fa>\n            <a href=\"{{ madeByUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 60%, transparent);text-decoration:none\">made by <b style=\"color:var(--color-accent-700)\">@jhkvrs<\u002Fb><\u002Fa>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n        <div class=\"dialog-actions\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ closeHelp }}\">Close<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showMiniPreview }}\" hint-placeholder-val=\"{{ false }}\">\n    <div ref=\"{{ miniRef }}\" style=\"{{ miniStyle }}\" sc-camel-on-pointer-down=\"{{ onMiniDown }}\">\n      <div ref=\"{{ miniHostRef }}\" style=\"position:relative;width:100%;height:100%;filter:drop-shadow(0 14px 30px rgba(0,0,0,.42))\"><\u002Fdiv>\n      <div style=\"{{ miniResizeHandleStyle }}\" sc-camel-on-pointer-down=\"{{ onMiniResize }}\">\n        <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 21H3v-6M15 3h6v6M21 3l-7 7M3 21l7-7\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showBackToTop }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ backToTop }}\" title=\"Back to top\" style=\"position:fixed;right:16px;bottom:18px;z-index:46;width:46px;height:46px;border-radius:50%;border:1px solid var(--color-divider);background:var(--color-surface);color:var(--color-text);box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;cursor:pointer;animation:pl-fade .25s ease\">\n      <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V6M6 12l6-6 6 6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultPlatform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;imessage&quot;,&quot;igdm&quot;,&quot;story&quot;,&quot;igprofile&quot;,&quot;igpost&quot;,&quot;discord&quot;,&quot;twitter&quot;],&quot;default&quot;:&quot;imessage&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Defaults&quot;}}\">\nconst PL_KEY = 'parallel.scene.v1';\nconst PL_PALETTE = ['#8e8e93','#5b6470','#a3673f','#3a7d5c','#4a5fb8','#8b3f7a','#b34b3f','#2f3437'];\nconst PL_REACTIONS = ['❤️','👍','👎','😂','‼️','❓'];\nconst FB_REACTIONS = ['👍','❤️','😆','😮','😢','😡'];\nconst PL_DEFAULT_REACTION = '😂';\nconst PL_BGS = [\n  { id: 'ink', css: '#101012' },\n  { id: 'sunset', css: 'linear-gradient(160deg,#f9ce34,#ee2a7b 55%,#6228d7)' },\n  { id: 'ocean', css: 'linear-gradient(160deg,#12c2e9,#c471ed,#f64f59)' },\n  { id: 'dusk', css: 'linear-gradient(160deg,#2b5876,#4e4376)' },\n  { id: 'paper', css: '#f3f2f2' },\n  { id: 'red', css: '#ec3013' }\n];\nconst PL_SANS = w.innerWidth < 880),\n      scrolledPast: false, miniScale: 1,\n      winW: (typeof window !== 'undefined' ? window.innerWidth : 1200) });\n    this._onResize = () => { const n = window.innerWidth < 880; if (n !== this.state.narrow || Math.abs((this.state.winW || 0) - window.innerWidth) > 6) this.setState({ narrow: n, winW: window.innerWidth }); };\n    this._onScroll = () => {\n      const el = this.scrollSentinelRef.current;\n      const past = el ? (el.getBoundingClientRect().top < 4) : false;\n      const patch = {};\n      if (past !== this.state.scrolledPast) patch.scrolledPast = past;\n      // The reply dropdown is fixed-positioned to the button's rect; close it on scroll\n      // so it can't drift away from its anchor.\n      if (this.state.openReply) patch.openReply = null;\n      if (Object.keys(patch).length) this.setState(patch);\n    };\n  }\n\n  componentWillUnmount() { try { window.removeEventListener('resize', this._onResize); window.removeEventListener('scroll', this._onScroll); } catch (e) {} }\n\n  updateMini() {\n    const host = this.miniRef && this.miniRef.current;\n    if (!host) return;\n    const active = this.state.narrow && this.state.ui && this.state.ui.popupPreview && this.state.scrolledPast;\n    if (!active) { if (host.firstChild) host.innerHTML = ''; return; }\n    const src = this.stageRef && this.stageRef.current;\n    if (!src) { host.innerHTML = ''; return; }\n    const r = src.getBoundingClientRect();\n    if (!r.width || !r.height) return;\n    const availH = host.clientHeight - 8, availW = host.clientWidth - 8;\n    const scale = Math.max(0.05, Math.min(availW / r.width, availH / r.height));\n    host.innerHTML = '';\n    const wrap = document.createElement('div');\n    wrap.style.width = r.width + 'px';\n    wrap.style.height = r.height + 'px';\n    wrap.style.position = 'absolute';\n    wrap.style.left = '50%';\n    wrap.style.top = '4px';\n    wrap.style.transform = 'translateX(-50%) scale(' + scale + ')';\n    wrap.style.transformOrigin = 'top center';\n    const clone = src.cloneNode(true);\n    clone.style.margin = '0';\n    wrap.appendChild(clone);\n    host.appendChild(wrap);\n  }\n\n  migrateStory(story) {\n    const st = Object.assign({}, story);\n    if (!Array.isArray(st.texts) || !st.texts.length) {\n      st.texts = (st.caption && st.caption.trim())\n        ? [{ id: plUid(), text: st.caption, xPct: 50, yPct: st.captionPos === 'top' ? 22 : (st.captionPos === 'bottom' ? 80 : 52), scale: st.captionSize === 'lg' ? 1.5 : (st.captionSize === 'sm' ? 0.75 : 1), rot: 0, style: st.captionStyle || 'boxed', color: '#ffffff' }]\n        : [];\n    }\n    return st;\n  }\n\n  componentDidMount() {\n    try { window.addEventListener('resize', this._onResize); window.addEventListener('scroll', this._onScroll, { passive: true }); } catch (e) {}\n    this.initAuth();\n    try {\n      const t = localStorage.getItem('parallel.theme');\n      if (t === 'dark' || t === 'light') this.setState({ theme: t });\n      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) this.setState({ theme: 'dark' });\n    } catch (e) {}\n    try {\n      const raw = localStorage.getItem(PL_KEY);\n      if (raw) {\n        const d = JSON.parse(raw);\n        if (d && Array.isArray(d.worlds) && d.worlds.length && d.activeWorld && d.worldScenes) {\n          // new (folders) format\n          const activeId = d.worldScenes[d.activeWorld] ? d.activeWorld : d.worlds[0].id;\n          this.setState(Object.assign({ worlds: d.worlds, activeWorld: activeId, worldScenes: d.worldScenes }, this.applyScene(d.worldScenes[activeId] || {})));\n        } else if (d && Array.isArray(d.people) && Array.isArray(d.messages) && d.ui) {\n          // old single-scene format — migrate into one folder\n          this.setState(Object.assign({ worlds: [{ id: 'w1', name: 'Folder 1' }], activeWorld: 'w1', worldScenes: {} }, this.applyScene(d)));\n        }\n      }\n    } catch (e) { /* storage unavailable — start fresh */ }\n  }\n\n  updateMini() {\n    const outer = this.miniRef && this.miniRef.current;\n    const host = this.miniHostRef && this.miniHostRef.current;\n    if (!outer || !host) return;\n    const active = this.state.narrow && this.state.ui && this.state.ui.popupPreview && this.state.scrolledPast;\n    if (!active) { if (host.firstChild) host.innerHTML = ''; return; }\n    const src = this.stageRef && this.stageRef.current;\n    if (!src) { if (host.firstChild) host.innerHTML = ''; return; }\n    const r = src.getBoundingClientRect();\n    if (!r.width || !r.height) return;\n    this._miniPhoneRect = { width: r.width, height: r.height };\n    const baseH = Math.min(window.innerHeight * 0.32, 340);\n    this._miniBaseH = baseH;\n    const targetH = Math.min(Math.max(baseH * (this.state.miniScale || 1), 70), window.innerHeight * 0.85);\n    const scale = targetH / r.height;\n    outer.style.width = Math.round(r.width * scale) + 'px';\n    outer.style.height = Math.round(targetH) + 'px';\n    const existing = host.firstChild;\n    // Only re-clone when the stage contents actually changed. Re-cloning on every\n    // render (typing, scroll, resize, menu toggles) is what made the pop-up flicker.\n    const sig = src.innerHTML;\n    if (existing && this._miniSig === sig) {\n      existing.style.width = r.width + 'px';\n      existing.style.height = r.height + 'px';\n      existing.style.transform = 'scale(' + scale + ')';\n      return;\n    }\n    this._miniSig = sig;\n    if (this._miniRaf) cancelAnimationFrame(this._miniRaf);\n    this._miniRaf = requestAnimationFrame(() => {\n      this._miniRaf = null;\n      const host2 = this.miniHostRef && this.miniHostRef.current;\n      const src2 = this.stageRef && this.stageRef.current;\n      if (!host2 || !src2) return;\n      const wrap = document.createElement('div');\n      wrap.style.cssText = 'width:' + r.width + 'px;height:' + r.height + 'px;position:absolute;left:0;top:0;transform-origin:top left;transform:scale(' + scale + ');pointer-events:none';\n      const clone = src2.cloneNode(true);\n      clone.style.margin = '0';\n      wrap.appendChild(clone);\n      const old = host2.firstChild;\n      host2.appendChild(wrap);\n      if (old) host2.removeChild(old);\n    });\n  }\n\n  miniResize(e) {\n    if (e.cancelable) e.preventDefault();\n    e.stopPropagation();\n    const outer = this.miniRef.current, host = this.miniHostRef.current, r = this._miniPhoneRect;\n    if (!outer || !host || !r) return;\n    const startY = e.touches ? e.touches[0].clientY : e.clientY;\n    const startX = e.touches ? e.touches[0].clientX : e.clientX;\n    const startH = outer.getBoundingClientRect().height;\n    const base = this._miniBaseH || startH;\n    let lastScale = this.state.miniScale || 1;\n    const move = (ev) => {\n      const y = ev.touches ? ev.touches[0].clientY : ev.clientY;\n      const x = ev.touches ? ev.touches[0].clientX : ev.clientX;\n      const delta = Math.max(y - startY, x - startX);\n      const newH = Math.min(Math.max(startH + delta, 70), window.innerHeight * 0.85);\n      const scale = newH / r.height;\n      outer.style.height = Math.round(newH) + 'px';\n      outer.style.width = Math.round(r.width * scale) + 'px';\n      const wrap = host.firstChild;\n      if (wrap) wrap.style.transform = 'scale(' + scale + ')';\n      lastScale = newH / base;\n    };\n    const up = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); this.setState({ miniScale: lastScale }); };\n    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);\n  }\n\n  miniDown(e) {\n    const el = e.currentTarget;\n    if (e.cancelable) e.preventDefault();\n    const rect = el.getBoundingClientRect();\n    const px = e.touches ? e.touches[0].clientX : e.clientX;\n    const py = e.touches ? e.touches[0].clientY : e.clientY;\n    const offX = px - rect.left, offY = py - rect.top;\n    const w = rect.wid
